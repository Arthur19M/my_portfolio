<!DOCTYPE html>
<html lang="en">
   <head>
      <title> Arthur M - Portfolio </title>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <link rel="stylesheet" href="css/font-awesome.css">
      <link rel="stylesheet" href="css/style.css">
   </head>
   <!-- PG Start -->
   <div class="page-loader">
      <div></div>
      <div></div>
      <div></div>
   </div>
   <!-- PG End -->
   <!-- BG Start -->
   <div class="bg-circles">
      <div class="circle-1"></div>
      <div class="circle-2"></div>
      <div class="circle-3"></div>
      <div class="circle-4"></div>
   </div>
   <!-- BG End -->
   <!-- Overlay Start -->
   <div class="overlay"></div>
   <!-- Overlay End -->
   <body>
      <!-- Main Start -->
      <div class="main hidden">
         <!-- Header Start -->
         <header class="header">
            <div class="container">
               <div class="row flex-end">
                   <button id="language-toggle" class="btn">FR</button>

                   <button type="button" class="nav-toggler">
                  <span></span>
                  </button>
                  <div class="nav">
                     <div class="nav-inner">
                        <ul>
                           <li><a href="#home" class="nav-item link-item" data-key="menu.home"></a></li>
                           <li><a href="#about" class="nav-item link-item" data-key="menu.about"></a></li>
                           <li><a href="#portfolio" class="nav-item link-item" data-key="menu.portfolio"></a></li>
                           <li><a href="#contact" class="nav-item link-item" data-key="menu.contact"></a></li>
                        </ul>
                     </div>
                  </div>
               </div>
            </div>
         </header>
         <!-- Header End -->
         <!--Home Section Start -->
         <section class="home-section align-items-center" id="home">
            <div class="container">
               <div class="row align-items-center">
                  <div class="home-text">

                      <p data-key="home.greeting"></p>
                      <h1 data-key="home.name"></h1>
                      <h2 data-key="home.role"></h2>
                      <h3 data-key="home.pitch"></h3>
                     <a href="#about" class="btn link-item" data-key="home.about"></a>
                     <a href="#portfolio" class="btn link-item" data-key="home.portfolio"></a>
                  </div>
                  <div class="home-img">
                     <div class="img-box">
                        <img src="img/profile-img.png" alt="profile-img">
                     </div>
                  </div>
               </div>
            </div>
         </section>
         <!--Home Section End -->
         <!-- About Section Start -->
         <section class="about-section sec-padding" id="about">
            <div class="container">
               <div class="row">
                  <div class="section-title">
                     <h2 data-key="about.title"></h2>
                  </div>
               </div>
               <div class="row">
                  <div class="about-img">
                     <div class="img-box">
                        <img src="img/about-img.png" alt="about-img">
                     </div>
                  </div>
                  <div class="about-text">
                     <p data-key="about.description"></p>
                     <h3 data-key="about.skills"></h3>
                     <div class="skills">
                         <div class="skill-item">Python</div>
                         <div class="skill-item">C</div>
                         <div class="skill-item">Git</div>
                         <div class="skill-item">SQL</div>
                         <div class="skill-item">Jupyter</div>
                         <div class="skill-item">Docker</div>
                         <div class="skill-item">Tableau</div>
                         <div class="skill-item">JAVA</div>
                         <div class="skill-item" data-key="about.h_skill1"></div>
                         <div class="skill-item" data-key="about.h_skill2"></div>
                         <div class="skill-item" data-key="about.h_skill3"></div>
                         <div class="skill-item" data-key="about.h_skill4"></div>
                         <div class="skill-item" data-key="about.h_skill5"></div>
                     </div>
                     <div class="about-tabs">
                        <button type="button" class="tab-item active" data-target="#education" data-key="about.education"></button>
                        <button type="button" class="tab-item" data-target="#experience" data-key="about.experience"></button>
                     </div>
                     <!-- Education Section Start -->
                     <div class="tab-content active" id="education">
                        <div class="timeline">
                            <div class="timeline-item">
                                <span class="date" data-key="about.ed.date1"></span>
                                <h4 data-key="about.ed.loc1"></h4>
                                <h3 data-key="about.ed.name1"></h3>
                                <p data-key="about.ed.desc1"></p>
                            </div>
                            <div class="timeline-item">
                                <span class="date" data-key="about.ed.date2"></span>
                                <h4 data-key="about.ed.loc2"></h4>
                                <h3 data-key="about.ed.name2"></h3>
                                <p data-key="about.ed.desc2"></p>
                            </div>
                            <div class="timeline-item">
                                <span class="date" data-key="about.ed.date3"></span>
                                <h4 data-key="about.ed.loc3"></h4>
                                <h3 data-key="about.ed.name3"></h3>
                                <p data-key="about.ed.desc3"></p>
                            </div>
                            <div class="timeline-item">
                                <span class="date" data-key="about.ed.date4"></span>
                                <h4 data-key="about.ed.loc4"></h4>
                                <h3 data-key="about.ed.name4"></h3>
                                <p data-key="about.ed.desc4"></p>
                            </div>
                        </div>
                     </div>
                     <!-- Education Section End -->
                     <!-- Exp Section Start -->
                     <div class="tab-content" id="experience">
                        <div class="timeline">
                            <div class="timeline-item">
                                <span class="date" data-key="about.exp.date1"></span>
                                <h4 data-key="about.exp.loc1"></h4>
                                <h3 data-key="about.exp.name1"></h3>
                                <p data-key="about.exp.desc1"></p>
                            </div>
                        </div>
                     </div>
                     <!-- Exp Section End -->
                     <a href="cv.pdf" target="_blank" class="btn" data-key="about.cv"></a>
                     <a href="#contact" class="btn link-item" data-key="about.contact"></a>
                  </div>
               </div>
            </div>
         </section>
         <!-- About Section End -->
          <!-- Portfolio Section Start -->
          <section class="portfolio-section sec-padding" id="portfolio">
              <div class="container">
                  <div class="row">
                      <div class="section-title">
                          <h2 data-key="portfolio.recentWork"></h2>
                      </div>
                  </div>
                  <div class="row" id="portfolio-items-container">
                      <!-- Portfolio items will be inserted here dynamically -->
                  </div>
              </div>
          </section>
          <!-- Portfolio Section End -->
          <!-- Contact Section Start -->
         <section class="contact-section sec-padding" id="contact">
            <div class="container">
               <div class="row">
                  <div class="section-title">
                     <h2 data-key="contact.title"></h2>
                  </div>
               </div>
               <div class="row">
                  <div class="contact-info">
                     <div class="contact-info-item">
                        <h3>Email</h3>
                        <p>exemple@mail.com</p>
                     </div>
                     <div class="contact-info-item">
                        <h3 data-key="contact.followMe"></h3>
                        <div class="social-links">
                           <a href="https://www.facebook.com/esiea" target="_blank"><i class="fab fa-facebook"></i></a>
                           <a href="https://www.instagram.com/esiea_school/" target="_blank"><i class="fab fa-instagram"></i></a>
                           <a href="https://www.youtube.com/user/ingenieuresiea" target="_blank"><i class="fab fa-youtube"></i></a>
                           <a href="https://www.linkedin.com/school/esiea-ecole/" target="_blank"><i class="fab fa-linkedin"></i></a>
                           <a href="https://github.com/Arthur19M" target="_blank"><i class="fab fa-github"></i></a>
                        </div>
                     </div>
                  </div>
               </div>
            </div>
         </section>
         <!-- Contact Section End -->
      </div>
      <!-- Main End -->
      <!-- Portfolio Item Details Popup Start -->
      <div class="portfolio-popup">
         <div class="pp-inner">
            <div class="pp-content">
               <div class="pp-header">
                  <button type="button" class="btn pp-close"><i class="fas fa-times"></i></button>
                  <div class="pp-thumbnail">
                     <img src="img/portfolio/1.jpg" alt="pp-thumbnail">
                  </div>
                  <h3></h3>
               </div>
               <div class="pp-body">
               </div>
            </div>
         </div>
      </div>
      <!-- Portfolio Item Details Popup Start -->
      <script src="js/script.js"></script>
   </body>
</html>
